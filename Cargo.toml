[package]
name = "shtstain"
version = "0.1.0"
edition = "2024"
description = "Tray app that tracks project folder sizes and dependency bloat (node_modules, venvs, target...)"
license = "MIT"
repository = "https://github.com/shanujha/shtstain"

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "0.26.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
